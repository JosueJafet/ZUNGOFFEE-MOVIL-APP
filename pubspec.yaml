name: zungofee_mobile
description: "Zungofee Mobile — Enterprise Mobile Application for Coffee Warehouse Management"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gestión de estado oficial (doc 02, sección 11)
  flutter_riverpod: ^2.5.1

  # Cliente HTTP oficial (doc 03, ADR-005)
  dio: ^5.4.3

  # Navegación oficial (doc 03, ADR-004)
  go_router: ^14.2.0

  # Almacenamiento seguro reservado para secretos que no sean la sesión de
  # Supabase (esta ya persiste y refresca su propio JWT automáticamente).
  flutter_secure_storage: ^9.2.2

  # Modelos y serialización (doc 02, sección 19)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  intl: ^0.19.0

  cupertino_icons: ^1.0.8

  # Autenticación (Supabase Auth) — CONTEXTO-MOVIL-FLUTTER.md, sección 4
  supabase_flutter: ^2.16.0

  # Tipografía de marca (Poppins/Inter/JetBrains Mono) — Guia de Marca
  # Zungoffee, Sprint 13. La propia guía recomienda Google Fonts en móvil.
  google_fonts: ^6.2.1

  # Isotipo oficial de Zungoffee (SVG) — rediseño visual de Home/Login.
  flutter_svg: ^2.0.10

  # Selección de foto de perfil desde galería/cámara (funciona en mobile
  # y en Flutter Web) — `POST /perfil/foto`.
  image_picker: ^1.1.2

  # Recorte de la foto de perfil antes de subirla (estilo WhatsApp:
  # círculo fijo, 1:1) — Android/iOS/Web, no Windows Desktop.
  image_cropper: ^12.2.1

  # Notificaciones push — CONTEXTO-PUSH-FCM-MOVIL.md. Solo Android por
  # ahora.
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

  # FCM no muestra la notificación nativa sola cuando la app está en
  # foreground — hay que mostrarla a mano (recomendación de la propia
  # doc de FCM).
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  flutter_lints: ^4.0.0

  # Simula las respuestas de `NetworkImage` en widget tests (p. ej. el
  # avatar de foto de perfil) — sin esto, `flutter_test` no permite
  # tráfico de red real y la carga de la imagen lanza una excepción no
  # capturada que rompe el test.
  network_image_mock: ^2.1.1

  # Genera los íconos de lanzador de Android desde `assets/icon/app_icon.png`
  # — reemplaza el ícono default de Flutter. Procesa el archivo de imagen
  # directamente (no pasa por el harness de `flutter test`), así que no
  # tiene el riesgo de colgarse que sí tuvo el intento anterior de
  # rasterizar el SVG dentro de un widget test.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
